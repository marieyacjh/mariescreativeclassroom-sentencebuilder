<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentence Builder - Marie's Creative Classroom</title>
    <style>
        :root {
            --lego-red: #D11013; --lego-blue: #0055BF; --lego-yellow: #F7D117;
            --lego-white: #FFFFFF; --lego-black: #231F20; --lego-gray: #A0A5A9;
        }

        body {
            font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", sans-serif;
            background-color: #f0f0f0; margin: 0; padding: 0;
            overflow-x: hidden; touch-action: manipulation;
        }

        .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        .main-title { 
            font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900; color: var(--lego-red); 
            text-shadow: 3px 3px 0 var(--lego-white), 6px 6px 0 var(--lego-black); margin: 10px 0;
        }

        /* BIG PHOTO UI */
        .photo-holder {
            width: 95%; height: 350px; border: 6px solid var(--lego-black);
            background: #eee; margin: 10px auto; display: flex;
            align-items: center; justify-content: center; border-radius: 15px; overflow: hidden;
        }
        .photo-holder img { width: 100%; height: 100%; object-fit: contain; }

        /* SENTENCE TILES */
        .sentence-area {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            padding: 20px; width: 95%; background: white; border: 4px solid var(--lego-black); border-radius: 15px;
        }
        .word-tile {
            background: var(--lego-yellow); border: 3px solid var(--lego-black);
            padding: 12px 24px; font-size: 1.6rem; font-weight: bold;
            border-radius: 10px; cursor: pointer; box-shadow: 0 5px 0 #000;
        }
        .word-tile.editing { background: white; color: var(--lego-blue); border-style: dashed; }
        .word-tile.wrong-guess { animation: shake 0.3s; background: var(--lego-red); color: white; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* KEYBOARD */
        .keyboard-wrap {
            width: 100%; max-width: 850px; background: #ddd;
            padding: 15px; border-radius: 15px; border: 3px solid #000; margin-top: auto;
        }
        .kb-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
        .key {
            background: white; border: 2px solid #000; padding: 12px;
            min-width: 40px; text-align: center; font-weight: bold;
            border-radius: 8px; cursor: pointer; box-shadow: 0 3px 0 #000; font-size: 1.1rem;
        }
        .key:active { transform: translateY(2px); box-shadow: none; }
        .btn { background-color: var(--lego-blue); color: white; border: 4px solid #000; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 8px; box-shadow: 0 5px 0 #000; }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen active">
        <h1 class="main-title">SENTENCE BUILDER</h1>
        <p>Marie’s Creative Classroom</p>
        <button class="btn" style="background:var(--lego-blue);" onclick="initMode('unscramble')">UNSCRAMBLE</button><br>
        <button class="btn" style="background:var(--lego-yellow); color:black;" onclick="initMode('spelling')">WHAT'S WRONG (SPELLING)</button><br>
        <button class="btn" style="background:var(--lego-red);" onclick="initMode('grammar')">WHAT'S WRONG (GRAMMAR)</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="photo-p" class="photo-holder"></div>
        <div id="area-p" class="sentence-area"></div>
        <div id="kb-p" class="keyboard-wrap"></div>
        <button class="btn" id="next-btn" style="display:none; margin-top:15px;" onclick="nextRound()">NEXT ROUND ➔</button>
    </div>

    <script>
        let gameList = [
            {sentence: "The big dog/dogg runs fast", img: ""},
            {sentence: "She is/are/is happy", img: ""} // Format: Wrong/Correct
        ];
        let currentIndex = 0;
        let currentMode = '';
        let typedBuffer = "";
        let activeIndex = null;
        let capsState = { p: true }; // Default to caps for visibility

        const keys = [
            ["Q","W","E","R","T","Y","U","I","O","P"],
            ["A","S","D","F","G","H","J","K","L"],
            ["Z","X","C","V","B","N","M", "Del"]
        ];

        function initMode(mode) {
            currentMode = mode;
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            loadRound();
        }

        function loadRound() {
            const item = gameList[currentIndex];
            const area = document.getElementById('area-p');
            area.innerHTML = '';
            typedBuffer = "";
            activeIndex = null;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('photo-p').innerHTML = item.img ? `<img src="${item.img}">` : "🖼️";

            let words = item.sentence.split(' ');
            words.forEach((w, idx) => {
                const tile = document.createElement('div');
                tile.className = 'word-tile';
                
                if(w.includes('/')) {
                    const [wrong, right] = w.split('/');
                    tile.innerText = wrong;
                    tile.onclick = () => startCorrection(idx, right);
                } else {
                    tile.innerText = w;
                    tile.onclick = () => {
                        tile.classList.add('wrong-guess');
                        setTimeout(() => tile.classList.remove('wrong-guess'), 400);
                    };
                }
                area.appendChild(tile);
            });
            renderKeyboard('p');
        }

        function renderKeyboard(side) {
            const kb = document.getElementById('kb-' + side);
            kb.innerHTML = '';
            keys.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'kb-row';
                row.forEach(k => {
                    const keyDiv = document.createElement('div');
                    keyDiv.className = 'key';
                    keyDiv.innerText = capsState[side] ? k : k.toLowerCase();
                    keyDiv.onclick = () => handleInput(side, k);
                    rowDiv.appendChild(keyDiv);
                });
                kb.appendChild(rowDiv);
            });
        }

        function startCorrection(idx, correct) {
            activeIndex = idx;
            const tiles = document.querySelectorAll('.word-tile');
            tiles.forEach(t => t.classList.remove('editing'));
            tiles[idx].classList.add('editing');
            tiles[idx].innerText = "_";
            typedBuffer = "";
        }

        function handleInput(side, char) {
            if(activeIndex === null) return;
            const correctStr = gameList[currentIndex].sentence.split(' ')[activeIndex].split('/')[1];
            
            if(char === 'Del') typedBuffer = typedBuffer.slice(0, -1);
            else typedBuffer += char;

            const tile = document.querySelectorAll('.word-tile')[activeIndex];
            tile.innerText = typedBuffer + "_";

            if(typedBuffer.toLowerCase() === correctStr.toLowerCase()) {
                tile.innerText = correctStr;
                tile.style.background = "#4CAF50";
                tile.classList.remove('editing');
                activeIndex = null;
                document.getElementById('next-btn').style.display = 'block';
            }
        }

        function nextRound() {
            currentIndex++;
            if(currentIndex < gameList.length) loadRound();
            else { alert("Amazing Job!"); location.reload(); }
        }
    </script>
</body>
</html>
