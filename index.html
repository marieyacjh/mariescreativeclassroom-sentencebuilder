<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentence Builder - Marie's Creative Classroom</title>
    <style>
        :root {
            /* LEGO Inspired Palette */
            --lego-red: #D11013;
            --lego-blue: #0055BF;
            --lego-yellow: #F7D117;
            --lego-white: #FFFFFF;
            --lego-black: #231F20;
            --lego-gray: #A0A5A9;
        }

        body {
            font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", sans-serif;
            background-color: #f0f0f0;
            color: var(--lego-black);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* LEGO Falling Bricks Background */
        .brick-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .lego-brick {
            position: absolute;
            width: 40px;
            height: 25px;
            border-radius: 4px;
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.2);
            animation: fall 10s linear infinite;
        }

        .lego-brick::before, .lego-brick::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 5px;
            background: inherit;
            top: -5px;
            border-radius: 2px 2px 0 0;
        }
        .lego-brick::before { left: 7px; }
        .lego-brick::after { left: 23px; }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Screen Management */
        .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; position: relative; z-index: 1; }
        .active { display: flex; }

        /* Typography */
        .main-title { 
            font-size: clamp(2.5rem, 8vw, 4.5rem); 
            font-weight: 900; 
            color: var(--lego-red); 
            text-shadow: 3px 3px 0 var(--lego-white), 6px 6px 0 var(--lego-black);
            margin-bottom: 0;
        }
        .sub-title { font-size: 1.5rem; color: var(--lego-blue); margin-top: 5px; }

        /* UI Elements */
        .btn {
            background-color: var(--lego-blue);
            color: white;
            border: 4px solid var(--lego-black);
            padding: 15px 30px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 6px 0 var(--lego-black);
            transition: all 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--lego-black); }
        .btn-yellow { background-color: var(--lego-yellow); color: var(--lego-black); }
        .btn-red { background-color: var(--lego-red); }

        /* Gameplay Styles */
        .sentence-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            min-height: 100px;
            width: 90%;
            background: white;
            padding: 20px;
            border: 5px solid var(--lego-black);
            border-radius: 12px;
            margin: 20px 0;
        }

        .word-tile {
            background: var(--lego-yellow);
            border: 3px solid var(--lego-black);
            padding: 10px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--lego-black);
            user-select: none;
        }

        .word-tile.wrong { background-color: var(--lego-red); color: white; }
        .word-tile.correct { background-color: #4CAF50; color: white; }

        .photo-holder {
            width: 250px;
            height: 180px;
            border: 4px solid var(--lego-gray);
            background: #ddd;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
        }
        .photo-holder img { max-width: 100%; max-height: 100%; object-fit: cover; }

        .scoreboard {
            background: var(--lego-black);
            color: var(--lego-yellow);
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .picker-box {
            background: var(--lego-white);
            border: 3px solid var(--lego-black);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        textarea { width: 90%; max-width: 500px; font-size: 1rem; padding: 10px; border: 3px solid var(--lego-black); border-radius: 8px; }

        /* Team Split UI */
        .duel-container { display: flex; width: 100vw; height: calc(100vh - 120px); }
        .team-side { flex: 1; border: 4px solid var(--lego-black); display: flex; flex-direction: column; align-items: center; padding: 10px; overflow-y: auto; background: rgba(255,255,255,0.8); }

        @media (max-width: 600px) {
            .duel-container { flex-direction: column; height: auto; }
            .team-side { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="brick-bg" id="brick-container"></div>

    <div id="menu-screen" class="screen active">
        <h1 class="main-title">SENTENCE BUILDER</h1>
        <p class="sub-title">Marie’s Creative Classroom</p>
        <div style="margin-top: 30px;">
            <button class="btn" onclick="openMode('practice')">PRACTICE</button>
            <button class="btn btn-yellow" onclick="openMode('duel')">TEAM DUEL</button>
        </div>
        <button class="btn btn-red" onclick="showScreen('edit-screen')">EDIT LIST</button>
    </div>

    <div id="mode-screen" class="screen">
        <h2>CHOOSE GAMEPLAY</h2>
        <button class="btn" onclick="startGame('unscramble')">1. UNSCRAMBLE</button>
        <button class="btn btn-yellow" onclick="startGame('wrong')">2. WHAT'S WRONG?</button>
        <button class="btn btn-red" onclick="showScreen('menu-screen')">BACK</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="picker-box">
            Student: <b id="st-num">-</b> 
            <button onclick="pickStudent('st-num')">PICK</button>
        </div>
        <div class="photo-holder" id="photo-p"></div>
        <div id="sentence-container" class="sentence-area"></div>
        <div id="pool-container" class="sentence-area" style="background: rgba(255,255,255,0.5)"></div>
        
        <div style="display:flex; gap: 10px;">
            <button class="btn btn-yellow" onclick="speakText()">LISTEN 🔊</button>
            <button id="next-btn" class="btn" style="display:none;" onclick="nextRound()">NEXT ➔</button>
        </div>
        <button class="btn btn-red" onclick="showScreen('menu-screen')">QUIT</button>
    </div>

    <div id="duel-screen" class="screen" style="padding:0;">
        <div class="duel-container">
            <div class="team-side" style="border-right: none;">
                <div class="scoreboard" id="score-a">0</div>
                <div class="picker-box">A: <b id="st-a">-</b> <button onclick="pickStudent('st-a')">PICK</button></div>
                <div class="photo-holder" id="photo-a"></div>
                <div id="area-a" class="sentence-area"></div>
                <div id="pool-a" class="sentence-area"></div>
            </div>
            <div class="team-side">
                <div class="scoreboard" id="score-b">0</div>
                <div class="picker-box">B: <b id="st-b">-</b> <button onclick="pickStudent('st-b')">PICK</button></div>
                <div class="photo-holder" id="photo-b"></div>
                <div id="area-b" class="sentence-area"></div>
                <div id="pool-b" class="sentence-area"></div>
            </div>
        </div>
        <div style="padding: 10px; display:flex; gap: 10px; background: var(--lego-black); width:100%; justify-content: center;">
            <button class="btn btn-yellow" onclick="speakText()">LISTEN</button>
            <button id="next-btn-duel" class="btn" style="display:none;" onclick="nextRound()">NEXT ROUND</button>
            <button class="btn btn-red" onclick="showScreen('menu-screen')">EXIT</button>
        </div>
    </div>

    <div id="edit-screen" class="screen">
        <h2>EDIT CONTENT</h2>
        <p>Format: Sentence | Image URL</p>
        <textarea id="list-input" rows="10">The big dog runs fast | https://images.unsplash.com/photo-1517849845537-4d257902454a?w=300
I like eating pizza | https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300
The cat sit on the mat | https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300</textarea>
        <button class="btn" onclick="generateLink()">SAVE & COPY LINK</button>
        <button class="btn btn-red" onclick="showScreen('menu-screen')">BACK</button>
    </div>

    <script>
        /* --- CORE DATA --- */
        let gameList = [];
        let currentIndex = 0;
        let currentMode = 'practice'; // practice or duel
        let currentGameStyle = 'unscramble'; // unscramble or wrong
        let scoreA = 0;
        let scoreB = 0;
        let solvedCount = 0;

        window.onload = () => {
            createBricks();
            const params = new URLSearchParams(window.location.search);
            const data = params.get('d');
            if(data) {
                try {
                    gameList = JSON.parse(atob(data));
                } catch(e) { console.error("Load error"); }
            } else {
                parseInput();
            }
        };

        function createBricks() {
            const container = document.getElementById('brick-container');
            const colors = ['#D11013', '#0055BF', '#F7D117', '#FFFFFF'];
            for(let i=0; i<15; i++) {
                const b = document.createElement('div');
                b.className = 'lego-brick';
                b.style.left = Math.random() * 95 + '%';
                b.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                b.style.animationDelay = (Math.random() * 8) + 's';
                container.appendChild(b);
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openMode(m) {
            currentMode = m;
            showScreen('mode-screen');
        }

        function parseInput() {
            const lines = document.getElementById('list-input').value.split('\n');
            gameList = lines.map(line => {
                const parts = line.split('|');
                return {
                    sentence: parts[0]?.trim() || "",
                    img: parts[1]?.trim() || ""
                };
            }).filter(item => item.sentence !== "");
        }

        /* --- GAME LOGIC --- */

        function startGame(style) {
            currentGameStyle = style;
            parseInput();
            currentIndex = 0;
            scoreA = 0; scoreB = 0;
            solvedCount = 0;
            updateScores();
            
            if(currentMode === 'practice') {
                showScreen('game-screen');
                loadRound('sentence-container', 'pool-container', 'photo-p');
            } else {
                showScreen('duel-screen');
                loadRound('area-a', 'pool-a', 'photo-a', 'A');
                loadRound('area-b', 'pool-b', 'photo-b', 'B');
            }
        }

        function loadRound(targetId, poolId, photoId, team = null) {
            const target = document.getElementById(targetId);
            const pool = document.getElementById(poolId);
            const photo = document.getElementById(photoId);
            const nextBtn = (currentMode === 'practice') ? document.getElementById('next-btn') : document.getElementById('next-btn-duel');
            
            target.innerHTML = '';
            pool.innerHTML = '';
            nextBtn.style.display = 'none';
            solvedCount = 0;

            const item = gameList[currentIndex];
            
            // Set Image
            photo.innerHTML = item.img ? `<img src="${item.img}">` : "🖼️";

            const words = item.sentence.split(' ');

            if(currentGameStyle === 'unscramble') {
                // Empty slots
                words.forEach(() => {
                    const slot = document.createElement('div');
                    slot.className = 'word-tile';
                    slot.style.background = '#eee';
                    slot.style.borderStyle = 'dashed';
                    slot.innerHTML = '&nbsp;&nbsp;&nbsp;';
                    target.appendChild(slot);
                });

                // Shuffled words
                const shuffled = [...words].sort(() => Math.random() - 0.5);
                shuffled.forEach(w => {
                    const tile = document.createElement('div');
                    tile.className = 'word-tile';
                    tile.innerText = w;
                    tile.onclick = () => {
                        const emptySlot = Array.from(target.children).find(s => s.innerText.trim() === "");
                        if(emptySlot) {
                            emptySlot.innerText = w;
                            emptySlot.style.background = 'var(--lego-yellow)';
                            emptySlot.style.borderStyle = 'solid';
                            tile.style.visibility = 'hidden';
                            checkWin(target, words, team);
                        }
                    };
                    pool.appendChild(tile);
                });
            } else {
                // WHAT'S WRONG mode
                // We create a "bugged" sentence logic. For simplicity, we assume the teacher 
                // might have typed an error, or we provide the sentence and student clicks 
                // the "wrong" word based on teacher instructions.
                words.forEach((w, idx) => {
                    const tile = document.createElement('div');
                    tile.className = 'word-tile';
                    tile.innerText = w;
                    tile.onclick = () => {
                        tile.classList.toggle('wrong');
                        // Simple toggle logic for classroom interaction
                        nextBtn.style.display = 'block';
                    };
                    target.appendChild(tile);
                });
                pool.innerHTML = "<i>Find the error and click it!</i>";
            }
        }

        function checkWin(container, originalWords, team) {
            const current = Array.from(container.children).map(c => c.innerText.trim());
            if(current.join(' ') === originalWords.join(' ')) {
                container.querySelectorAll('.word-tile').forEach(t => t.classList.add('correct'));
                if(team === 'A') scoreA += 1;
                if(team === 'B') scoreB += 1;
                updateScores();
                
                solvedCount++;
                const threshold = (currentMode === 'practice') ? 1 : 2;
                if(solvedCount >= threshold) {
                    const btn = (currentMode === 'practice') ? document.getElementById('next-btn') : document.getElementById('next-btn-duel');
                    btn.style.display = 'block';
                }
            }
        }

        function nextRound() {
            currentIndex++;
            if(currentIndex >= gameList.length) {
                alert("Great Job! End of the list.");
                showScreen('menu-screen');
            } else {
                if(currentMode === 'practice') {
                    loadRound('sentence-container', 'pool-container', 'photo-p');
                } else {
                    loadRound('area-a', 'pool-a', 'photo-a', 'A');
                    loadRound('area-b', 'pool-b', 'photo-b', 'B');
                }
            }
        }

        function updateScores() {
            if(document.getElementById('score-a')) {
                document.getElementById('score-a').innerText = scoreA;
                document.getElementById('score-b').innerText = scoreB;
            }
        }

        function speakText() {
            const msg = new SpeechSynthesisUtterance(gameList[currentIndex].sentence);
            window.speechSynthesis.speak(msg);
        }

        function pickStudent(id) {
            const num = Math.floor(Math.random() * 20) + 1;
            document.getElementById(id).innerText = "#" + num;
        }

        /* --- DATA PERSISTENCE --- */
        function generateLink() {
            parseInput();
            const data = btoa(JSON.stringify(gameList));
            const url = window.location.href.split('?')[0] + "?d=" + data;
            navigator.clipboard.writeText(url);
            alert("Link copied to clipboard! You can now paste this into your browser or share it.");
        }
    </script>
</body>
</html>
