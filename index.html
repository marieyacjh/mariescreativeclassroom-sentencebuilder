<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentence Builder - Marie's Creative Classroom</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --lego-red: #D11013; --lego-blue: #0055BF; --lego-yellow: #F7D117;
            --lego-white: #FFFFFF; --lego-black: #231F20; --lego-gray: #A0A5A9;
        }

        body {
            font-family: "Comic Sans MS", cursive; background-color: #f0f0f0;
            color: var(--lego-black); margin: 0; padding: 0; overflow-x: hidden;
        }

        .brick-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .lego-brick {
            position: absolute; width: 40px; height: 25px; border-radius: 4px;
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.2); animation: fall 10s linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; position: relative; z-index: 1; }
        .active { display: flex; }

        .btn {
            background-color: var(--lego-blue); color: white; border: 4px solid var(--lego-black);
            padding: 10px 20px; font-size: 1.1rem; font-weight: bold; border-radius: 8px;
            cursor: pointer; margin: 5px; box-shadow: 0 4px 0 var(--lego-black); transition: 0.1s;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--lego-black); }
        .btn-yellow { background-color: var(--lego-yellow); color: var(--lego-black); }
        .btn-red { background-color: var(--lego-red); }

        .sentence-area {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
            min-height: 60px; width: 90%; background: white; padding: 15px;
            border: 3px solid #000; border-radius: 12px; margin: 10px 0; font-size: 1.5rem;
        }

        .keyboard {
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px;
            max-width: 600px; margin-top: 10px; background: #ddd; padding: 10px; border-radius: 10px;
        }
        .key {
            padding: 10px; background: white; border: 2px solid #000; border-radius: 5px;
            text-align: center; cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        .key:active { background: var(--lego-yellow); }
        .key-wide { grid-column: span 1.5; }

        .photo-holder { width: 180px; height: 120px; border: 3px solid #000; background: #eee; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .photo-holder img { width: 100%; height: 100%; object-fit: cover; }

        .edit-row { display: flex; gap: 10px; margin-bottom: 10px; width: 100%; align-items: center; background: #fff; padding: 8px; border: 2px solid #000; }
        .drop-zone { width: 60px; height: 60px; border: 2px dashed #666; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 0.5rem; }
        
        #qr-container { background: white; padding: 10px; margin-top: 10px; border: 2px solid #000; }
    </style>
</head>
<body>

    <div class="brick-bg" id="brick-container"></div>

    <div id="menu-screen" class="screen active">
        <h1 style="color:var(--lego-red); text-shadow: 2px 2px #fff;">SENTENCE BUILDER</h1>
        <button class="btn" onclick="openStyleSelect('practice')">PRACTICE</button>
        <button class="btn btn-yellow" onclick="showScreen('setup-screen')">TEAM DUEL</button>
        <button class="btn btn-red" onclick="refreshEditUI(); showScreen('edit-screen');">EDIT LIST</button>
        <button class="btn" onclick="showScreen('link-screen')">GAME LINK</button>
        <button class="btn btn-yellow" onclick="showHistory()">LINK HISTORY</button>
    </div>

    <div id="link-screen" class="screen">
        <button class="btn btn-red" onclick="showScreen('menu-screen')">← BACK</button>
        <h2>PASTE GAME LINK</h2>
        <textarea id="paste-link-area" style="width:80%; height:100px; padding:10px;"></textarea>
        <button class="btn" onclick="importLink()">LOAD GAME</button>
    </div>

    <div id="edit-screen" class="screen">
        <button class="btn btn-red" onclick="showScreen('menu-screen')">← BACK</button>
        <h2>EDIT LIST</h2>
        <div id="edit-list-container" style="width:100%; max-height:40vh; overflow-y:auto;"></div>
        <button class="btn" onclick="addNewRow()">+ ADD</button>
        <button class="btn btn-yellow" onclick="generateAndShowLink()">GENERATE & SHARE</button>
        
        <div id="share-section" style="display:none; text-align:center;">
            <p>Link Ready!</p>
            <input type="text" id="share-link-val" readonly style="width:80%;">
            <button class="btn" onclick="copyGenLink()">COPY</button>
            <div id="qr-container"></div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <button class="btn btn-red" onclick="showScreen('menu-screen')">← EXIT</button>
        <div id="student-box" style="background:#fff; padding:5px; border:2px solid #000; margin:5px;">
            Total Students: <input type="text" id="st-total" value="1-20" style="width:50px;">
            <button onclick="pickStudent('st-disp', document.getElementById('st-total').value)">PICK</button>
            <b id="st-disp">-</b>
        </div>
        <div class="photo-holder" id="photo-p"></div>
        <div id="target-area" class="sentence-area"></div>
        <div id="keyboard-container" style="display:none;">
            <div class="keyboard" id="qwerty"></div>
        </div>
        <div id="pool-area" class="sentence-area"></div>
        <button id="next-btn" class="btn btn-yellow" style="display:none;" onclick="nextRound()">NEXT ROUND ➔</button>
    </div>

    <div id="setup-screen" class="screen">
        <button class="btn btn-red" onclick="showScreen('menu-screen')">← BACK</button>
        <h2>TEAMS</h2>
        <input type="text" id="tA" value="TEAM A"> vs <input type="text" id="tB" value="TEAM B">
        <button class="btn" onclick="openStyleSelect('duel')">CONTINUE</button>
    </div>

    <div id="mode-screen" class="screen">
        <button class="btn btn-red" onclick="showScreen('menu-screen')">← BACK</button>
        <button class="btn" onclick="initGame('unscramble')">UNSCRAMBLE</button>
        <button class="btn btn-yellow" onclick="initGame('wrong')">WHAT'S WRONG?</button>
    </div>

    <script>
        let gameList = [{sentence: "The cat sleeps", img: ""}];
        let currentIndex = 0;
        let currentGameMode = 'practice';
        let currentGameStyle = 'unscramble';
        let history = JSON.parse(localStorage.getItem('gameHistory') || '[]');
        let currentInput = "";

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openStyleSelect(mode) { currentGameMode = mode; showScreen('mode-screen'); }

        function initGame(style) {
            currentGameStyle = style;
            currentIndex = 0;
            loadRound();
            showScreen('game-screen');
        }

        function loadRound() {
            currentInput = "";
            document.getElementById('next-btn').style.display = 'none';
            const item = gameList[currentIndex];
            const target = document.getElementById('target-area');
            const pool = document.getElementById('pool-area');
            const kb = document.getElementById('keyboard-container');
            
            document.getElementById('photo-p').innerHTML = item.img ? `<img src="${item.img}">` : "🖼️";
            target.innerHTML = ""; pool.innerHTML = "";
            kb.style.display = (currentGameStyle === 'wrong') ? 'block' : 'none';

            if(currentGameStyle === 'unscramble') {
                let words = item.sentence.split(' ');
                [...words].sort(() => Math.random()-0.5).forEach(w => {
                    let tile = document.createElement('div');
                    tile.className = 'word-tile'; tile.innerText = w;
                    tile.style.padding = "8px"; tile.style.border = "2px solid #000"; tile.style.background = "#F7D117";
                    tile.onclick = () => {
                        if(tile.parentElement === pool) target.appendChild(tile);
                        else pool.appendChild(tile);
                        if(Array.from(target.children).map(t=>t.innerText).join(' ') === item.sentence) {
                            document.getElementById('next-btn').style.display = 'block';
                        }
                    };
                    pool.appendChild(tile);
                });
            } else {
                // WHAT'S WRONG Logic
                let words = item.sentence.split(' ');
                let bugged = [...words];
                if(bugged.length > 1) { [bugged[0], bugged[1]] = [bugged[1], bugged[0]]; }
                target.innerText = bugged.join(' ');
                setupKeyboard();
            }
        }

        function setupKeyboard() {
            const keys = "QWERTYUIOPASDFGHJKLZXCVBNM".split("");
            const kb = document.getElementById('qwerty');
            kb.innerHTML = "";
            keys.forEach(k => {
                let key = document.createElement('div');
                key.className = 'key'; key.innerText = k;
                key.onclick = () => { currentInput += k; checkTyped(); };
                kb.appendChild(key);
            });
            let space = document.createElement('div');
            space.className = 'key key-wide'; space.innerText = "SPACE";
            space.onclick = () => { currentInput += " "; checkTyped(); };
            kb.appendChild(space);
            let del = document.createElement('div');
            del.className = 'key key-wide'; del.innerText = "DEL";
            del.onclick = () => { currentInput = currentInput.slice(0, -1); checkTyped(); };
            kb.appendChild(del);
        }

        function checkTyped() {
            document.getElementById('target-area').innerText = currentInput || "TYPE ANSWER...";
            if(currentInput.toLowerCase().trim() === gameList[currentIndex].sentence.toLowerCase().trim()) {
                document.getElementById('target-area').style.color = "green";
                document.getElementById('next-btn').style.display = "block";
            } else {
                document.getElementById('target-area').style.color = "black";
            }
        }

        function nextRound() {
            currentIndex++;
            if(currentIndex < gameList.length) loadRound();
            else { alert("Finish!"); showScreen('menu-screen'); }
        }

        /* --- EDIT & LINK LOGIC --- */
        function refreshEditUI() {
            const container = document.getElementById('edit-list-container');
            container.innerHTML = '';
            gameList.forEach((item, idx) => {
                const row = document.createElement('div'); row.className = 'edit-row';
                row.innerHTML = `<div class="drop-zone" id="drop-${idx}">${item.img?`<img src="${item.img}">`:'Drop'}</div>
                <input type="text" value="${item.sentence}" onchange="gameList[${idx}].sentence=this.value" style="flex:1">`;
                container.appendChild(row);
                setupDrop(document.getElementById(`drop-${idx}`), idx);
            });
        }

        function setupDrop(zone, idx) {
            zone.ondragover = e => e.preventDefault();
            zone.ondrop = e => {
                e.preventDefault();
                const reader = new FileReader();
                reader.onload = ev => { gameList[idx].img = ev.target.result; refreshEditUI(); };
                reader.readAsDataURL(e.dataTransfer.files[0]);
            };
        }

        function generateAndShowLink() {
            const data = btoa(JSON.stringify(gameList));
            const url = window.location.href.split('?')[0] + "?d=" + data;
            document.getElementById('share-link-val').value = url;
            document.getElementById('share-section').style.display = 'block';
            document.getElementById('qr-container').innerHTML = "";
            new QRCode(document.getElementById("qr-container"), { text: url, width: 128, height: 128 });
            
            history.push({date: new Date().toLocaleString(), link: url});
            localStorage.setItem('gameHistory', JSON.stringify(history));
        }

        function copyGenLink() {
            navigator.clipboard.writeText(document.getElementById('share-link-val').value);
            alert("Copied!");
        }

        function importLink() {
            const val = document.getElementById('paste-link-area').value;
            if(val.includes("?d=")) {
                const data = val.split("?d=")[1];
                gameList = JSON.parse(atob(data));
                alert("Loaded!");
                showScreen('menu-screen');
            }
        }

        function showHistory() {
            let hText = history.map(h => h.date).join("\n") || "No history";
            alert("History:\n" + hText);
        }

        function pickStudent(id, range) {
            let nums = [];
            range.split('-').forEach((v, i, a) => { if(a.length==2) { for(let j=parseInt(a[0]); j<=parseInt(a[1]); j++) nums.push(j); } else nums.push(parseInt(v)); });
            document.getElementById(id).innerText = "#" + nums[Math.floor(Math.random()*nums.length)];
        }

        function addNewRow() { gameList.push({sentence: "", img: ""}); refreshEditUI(); }

        // Falling bricks logic
        const container = document.getElementById('brick-container');
        const colors = ['#D11013', '#0055BF', '#F7D117'];
        for(let i=0; i<15; i++) {
            let b = document.createElement('div'); b.className = 'lego-brick';
            b.style.left = Math.random()*95+'%'; b.style.backgroundColor = colors[i%3];
            b.style.animationDelay = Math.random()*5+'s'; container.appendChild(b);
        }
        
        // Auto-load if URL has data
        const params = new URLSearchParams(window.location.search);
        if(params.get('d')) gameList = JSON.parse(atob(params.get('d')));
    </script>
</body>
</html>
