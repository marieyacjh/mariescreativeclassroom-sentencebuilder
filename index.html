<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spelling Bee - Marie's Creative Classroom </title>
    <style>
        :root {
            --lego-red: #e3000b;
            --lego-blue: #0055bf;
            --lego-yellow: #ffcf00;
            --lego-green: #008528;
            --lego-black: #000000;
            --lego-grey: #a0a5a9;
            --baseplate: #dcdcdc;
            --game-scale: 1;
        }

        body {
            font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", sans-serif;
            background-color: var(--baseplate);
            /* LEGO Baseplate Pattern */
            background-image: radial-gradient(#bcbcbc 15%, transparent 20%);
            background-size: 40px 40px;
            color: var(--lego-black);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Floating LEGO Bricks Animation */
        .lego-brick {
            position: absolute; width: 60px; height: 30px; border-radius: 4px;
            opacity: 0.7; z-index: 0; animation: float 10s infinite linear;
            box-shadow: inset -4px -4px 0 rgba(0,0,0,0.2);
        }
        .lego-brick::before {
            content: ''; position: absolute; top: -8px; left: 10px;
            width: 12px; height: 8px; background: inherit; border-radius: 2px 2px 0 0;
            box-shadow: 25px 0 0 inherit;
        }

        @keyframes float {
            0% { left: -10%; transform: translateY(0px) rotate(0deg); }
            100% { left: 110%; transform: translateY(-100px) rotate(360deg); }
        }

        .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; position: relative; z-index: 1; }
        .active { display: flex; }

        /* 3D LEGO Button Design */
        .btn {
            background-color: var(--lego-blue);
            border: 3px solid var(--lego-black);
            border-radius: 4px;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            color: white;
            text-transform: uppercase;
            box-shadow: 0 8px 0 var(--lego-black);
            position: relative;
            transition: all 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--lego-black); }
        .btn-red { background-color: var(--lego-red); }
        .btn-green { background-color: var(--lego-green); }
        .btn-yellow { background-color: var(--lego-yellow); color: black; }
        .btn-small { padding: 8px 15px; font-size: 1rem; box-shadow: 0 4px 0 var(--lego-black); }

        .main-title { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900; color: var(--lego-red); -webkit-text-stroke: 2px black; text-shadow: 4px 4px 0 var(--lego-yellow); margin-bottom: 30px; }

        .game-picker {
            background: #fff; border: 4px solid var(--lego-black); border-radius: 8px;
            padding: 10px; display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
        }

        .display-area { 
            font-size: 2.2rem; font-weight: bold; min-height: 80px; margin: 20px; 
            padding: 15px; background: white; border: 4px solid var(--lego-black);
            border-radius: 8px; text-align: center; width: 90%; max-width: 800px;
        }

        /* Sentence Building Tiles */
        .tile {
            display: inline-block; padding: 10px 20px; background: var(--lego-yellow);
            border: 3px solid var(--lego-black); border-radius: 6px; margin: 5px;
            cursor: pointer; box-shadow: 0 5px 0 var(--lego-black); font-size: 1.5rem;
        }
        .tile:hover { background: #ffe055; }
        .tile-empty { border: 3px dashed #888; background: rgba(255,255,255,0.3); box-shadow: none; }

        /* Keyboard */
        .keyboard { 
            display: flex; flex-direction: column; align-items: center; width: 100%; 
            transform: scale(var(--game-scale)); transform-origin: top center;
        }
        .kb-row { display: flex; justify-content: center; margin-bottom: 5px; }
        .key {
            min-width: 45px; height: 55px; margin: 3px; background: #fff;
            border: 3px solid var(--lego-black); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #888;
        }
        .key:active { transform: translateY(2px); box-shadow: 0 2px 0 #888; }

        .scoreboard { font-size: 2rem; background: var(--lego-yellow); padding: 5px 20px; border: 4px solid var(--lego-black); border-radius: 8px; }

        .duel-container { display: flex; width: 100vw; height: 75vh; }
        .team-side { flex: 1; display: flex; flex-direction: column; align-items: center; border: 2px solid var(--lego-black); padding: 10px; }
        
        textarea { width: 80%; height: 200px; font-family: sans-serif; font-size: 1rem; border: 4px solid black; }
        #history-list { width: 80%; background: white; border: 3px solid black; padding: 10px; }
    </style>
</head>
<body>

    <button class="btn btn-small" style="position:fixed; top:10px; left:10px; z-index:100" onclick="showScreen('menu-screen')">MENU</button>

    <div id="menu-screen" class="screen active">
        <h1 class="main-title">SENTENCE BUILDER</h1>
        <div id="load-msg" style="color:var(--lego-green); font-weight:bold; display:none;">BRICKS LOADED!</div>
        <button class="btn btn-green" onclick="openModeSelect('practice')">PRACTICE</button>
        <button class="btn btn-blue" onclick="openModeSelect('duel')">TEAM DUEL</button>
        <button class="btn btn-yellow" onclick="showScreen('edit-screen')">EDIT LIST</button>
        <button class="btn btn-red" onclick="showHistory()">HISTORY</button>
    </div>

    <div id="mode-screen" class="screen">
        <h2 class="main-title" style="font-size: 2.5rem;">SELECT MODE</h2>
        <div class="game-picker">
            <span>SENTENCE ORDER:</span>
            <label><input type="radio" name="order-sel" value="normal" checked> Normal</label>
            <label><input type="radio" name="order-sel" value="shuffle"> Shuffle</label>
        </div>
        <button class="btn" onclick="startSetup('unscramble')">UNSCRAMBLE</button>
        <button class="btn btn-red" onclick="startSetup('spell')">SEARCH AND SPELL</button>
        <button class="btn btn-yellow" onclick="startSetup('grammar')">WHAT'S WRONG?</button>
    </div>

    <div id="setup-screen" class="screen">
        <h2 class="main-title" style="font-size: 2.5rem;">TEAM SETUP</h2>
        <div style="display:flex; gap:20px;">
            <div>
                <h3>TEAM A</h3>
                <input type="text" id="team-a-name" value="RED TEAM"><br>
                <input type="text" id="team-a-range" value="1-20" style="width:60px">
            </div>
            <div>
                <h3>TEAM B</h3>
                <input type="text" id="team-b-name" value="BLUE TEAM"><br>
                <input type="text" id="team-b-range" value="1-20" style="width:60px">
            </div>
        </div>
        <button class="btn btn-green" onclick="confirmStart()">BUILD!</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="game-picker">
            <span>Student:</span> <b id="num-p">-</b>
            <button class="btn btn-small" onclick="pickStudent('p')">PICK</button>
            <input type="range" min="0.5" max="1.5" step="0.1" value="1" oninput="adjustZoom(this.value)">
        </div>
        <div id="p-display" class="display-area"></div>
        <div id="p-interaction"></div>
        <button class="btn btn-yellow" onclick="speakSentence()">🔊 LISTEN</button>
        <button id="next-p" class="btn btn-green" style="display:none" onclick="nextRound()">NEXT ➔</button>
    </div>

    <div id="duel-screen" class="screen" style="padding:0">
        <div class="duel-container">
            <div class="team-side" style="background:#ffebee">
                <div id="score-l" class="scoreboard">0</div>
                <div class="game-picker"><b id="name-l">RED</b>: <span id="num-l">-</span> <button class="btn btn-small" onclick="pickStudent('l')">PICK</button></div>
                <div id="l-display" class="display-area" style="font-size:1.5rem"></div>
                <div id="l-interaction"></div>
            </div>
            <div class="team-side" style="background:#e3f2fd">
                <div id="score-r" class="scoreboard">0</div>
                <div class="game-picker"><b id="name-r">BLUE</b>: <span id="num-r">-</span> <button class="btn btn-small" onclick="pickStudent('r')">PICK</button></div>
                <div id="r-display" class="display-area" style="font-size:1.5rem"></div>
                <div id="r-interaction"></div>
            </div>
        </div>
        <button class="btn btn-yellow btn-small" style="position:fixed; bottom:70px" onclick="speakSentence()">🔊 LISTEN</button>
        <button id="next-duel" class="btn btn-green" style="position:fixed; bottom:10px; display:none" onclick="nextRound()">NEXT ROUND ➔</button>
    </div>

    <div id="edit-screen" class="screen">
        <h2>EDIT SENTENCES</h2>
        <p>Format: Sentence | Target Word (for Spell/Grammar)</p>
        <textarea id="word-input">
The quick brown fox jumps over the dog. | jumps
He goes to school every day. | goes
I am eating a giant red apple. | eating
She does not like pizza. | pizza</textarea>
        <button class="btn btn-green" onclick="saveList()">SAVE & LINK</button>
        <div id="link-box" style="word-break:break-all; padding:10px; background:#eee; display:none"></div>
    </div>

    <div id="history-screen" class="screen">
        <h2>HISTORY</h2>
        <div id="history-list"></div>
    </div>

    <script>
        let sentences = [];
        let index = 0;
        let playType = 'practice'; // practice vs duel
        let gameMode = 'unscramble'; // unscramble, spell, grammar
        let scores = { A: 0, B: 0 };
        let isWaiting = false;

        // --- Initialization ---
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('w');
            if(data) {
                sentences = JSON.parse(atob(data));
                document.getElementById('load-msg').style.display = 'block';
                document.getElementById('word-input').value = sentences.map(s => s.full + (s.target ? " | " + s.target : "")).join('\n');
            }
            createFloatingBricks();
        };

        function createFloatingBricks() {
            const colors = ['var(--lego-red)', 'var(--lego-blue)', 'var(--lego-yellow)', 'var(--lego-green)'];
            for(let i=0; i<6; i++){
                let b = document.createElement('div');
                b.className = 'lego-brick';
                b.style.background = colors[i % 4];
                b.style.top = (Math.random() * 80) + "%";
                b.style.animationDelay = (i * 2) + "s";
                document.body.appendChild(b);
            }
        }

        // --- Navigation & Logic ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openModeSelect(type) {
            playType = type;
            showScreen('mode-screen');
        }

        function startSetup(mode) {
            gameMode = mode;
            if(playType === 'duel') showScreen('setup-screen');
            else confirmStart();
        }

        function confirmStart() {
            index = 0; scores = { A:0, B:0 };
            const order = document.querySelector('input[name="order-sel"]:checked').value;
            
            // Process sentence objects
            const raw = document.getElementById('word-input').value.split('\n').filter(l => l.trim());
            sentences = raw.map(line => {
                let parts = line.split('|');
                return { full: parts[0].trim(), target: parts[1] ? parts[1].trim() : "" };
            });

            if(order === 'shuffle') sentences.sort(() => Math.random() - 0.5);
            
            if(playType === 'duel') {
                document.getElementById('name-l').innerText = document.getElementById('team-a-name').value;
                document.getElementById('name-r').innerText = document.getElementById('team-b-name').value;
                document.getElementById('score-l').innerText = "0";
                document.getElementById('score-r').innerText = "0";
                showScreen('duel-screen');
                renderRound('l'); renderRound('r');
            } else {
                showScreen('game-screen');
                renderRound('p');
            }
        }

        function renderRound(side) {
            isWaiting = false;
            const container = document.getElementById(side + '-interaction');
            const display = document.getElementById(side + '-display');
            container.innerHTML = '';
            display.innerText = '';
            display.classList.remove('tile-empty');

            const current = sentences[index];

            if(gameMode === 'unscramble') {
                display.classList.add('tile-empty');
                const words = current.full.split(' ').sort(() => Math.random() - 0.5);
                words.forEach(w => {
                    const t = document.createElement('div');
                    t.className = 'tile';
                    t.innerText = w;
                    t.onclick = () => {
                        if(isWaiting) return;
                        const space = display.innerText === '' ? '' : ' ';
                        display.innerText += space + w;
                        t.style.display = 'none';
                        if(display.innerText.trim() === current.full) win(side);
                    };
                    container.appendChild(t);
                });
                const reset = document.createElement('button');
                reset.className = "btn btn-small btn-red"; reset.innerText = "RESET";
                reset.onclick = () => renderRound(side);
                container.appendChild(document.createElement('br'));
                container.appendChild(reset);
            } 
            else if(gameMode === 'spell' || gameMode === 'grammar') {
                let promptText = current.full;
                if(gameMode === 'spell') {
                    // Create minor spelling error in target word
                    let target = current.target || current.full.split(' ')[1];
                    let wrong = target.length > 3 ? target.slice(0, -1) : target + "z";
                    promptText = current.full.replace(target, wrong);
                    display.dataset.answer = target;
                } else {
                    // Grammar error (Client provides manually via | )
                    display.dataset.answer = current.target;
                }
                display.innerText = promptText;
                display.style.color = "var(--lego-red)";
                
                const inputArea = document.createElement('div');
                inputArea.id = side + "-input-val";
                inputArea.style.fontSize = "1.5rem"; inputArea.style.margin = "10px";
                inputArea.innerText = "_";
                container.appendChild(inputArea);
                renderKeyboard(container, side);
            }
        }

        function renderKeyboard(target, side) {
            const kb = document.createElement('div'); kb.className = "keyboard";
            const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM "];
            rows.forEach(row => {
                const rDiv = document.createElement('div'); rDiv.className = "kb-row";
                row.split('').forEach(char => {
                    const k = document.createElement('div'); k.className = "key";
                    k.innerText = char === " " ? "SPACE" : char;
                    k.style.width = char === " " ? "100px" : "45px";
                    k.onclick = () => {
                        const out = document.getElementById(side + "-input-val");
                        if(isWaiting) return;
                        if(out.innerText === "_") out.innerText = "";
                        out.innerText += char;
                        if(out.innerText.trim().toLowerCase() === document.getElementById(side + "-display").dataset.answer.toLowerCase()) {
                            win(side);
                        }
                    };
                    rDiv.appendChild(k);
                });
                kb.appendChild(rDiv);
            });
            const del = document.createElement('div'); del.className = "key"; del.innerText = "DEL";
            del.onclick = () => document.getElementById(side + "-input-val").innerText = "_";
            kb.lastChild.appendChild(del);
            target.appendChild(kb);
        }

        function win(side) {
            isWaiting = true;
            document.getElementById(side + '-display').style.color = "var(--lego-green)";
            document.getElementById(side + '-display').innerText = sentences[index].full;
            
            if(playType === 'duel') {
                if(side === 'l') scores.A++; else scores.B++;
                document.getElementById('score-l').innerText = scores.A;
                document.getElementById('score-r').innerText = scores.B;
                document.getElementById('next-duel').style.display = 'block';
            } else {
                document.getElementById('next-p').style.display = 'block';
            }
            speakSentence();
        }

        function nextRound() {
            index++;
            if(index >= sentences.length) {
                alert("GAME OVER!\nFinal: " + scores.A + " to " + scores.B);
                showScreen('menu-screen');
                return;
            }
            document.getElementById('next-p').style.display = 'none';
            document.getElementById('next-duel').style.display = 'none';
            if(playType === 'duel') { renderRound('l'); renderRound('r'); }
            else renderRound('p');
        }

        function speakSentence() {
            const u = new SpeechSynthesisUtterance(sentences[index].full);
            u.lang = 'en-US'; window.speechSynthesis.speak(u);
        }

        function adjustZoom(v) { document.documentElement.style.setProperty('--game-scale', v); }

        function pickStudent(side) {
            let range = (side === 'p') ? "1-20" : (side === 'l' ? document.getElementById('team-a-range').value : document.getElementById('team-b-range').value);
            let nums = [];
            range.split(',').forEach(r => {
                if(r.includes('-')) {
                    let p = r.split('-');
                    for(let i=parseInt(p[0]); i<=parseInt(p[1]); i++) nums.push(i);
                } else nums.push(parseInt(r));
            });
            document.getElementById('num-' + side).innerText = nums[Math.floor(Math.random()*nums.length)];
        }

        function saveList() {
            const list = document.getElementById('word-input').value.split('\n').filter(l => l.trim()).map(line => {
                let parts = line.split('|');
                return { full: parts[0].trim(), target: parts[1] ? parts[1].trim() : "" };
            });
            const encoded = btoa(JSON.stringify(list));
            const url = window.location.href.split('?')[0] + "?w=" + encoded;
            const lb = document.getElementById('link-box');
            lb.innerHTML = `<b>COPY THIS:</b><br>${url}`;
            lb.style.display = 'block';
            navigator.clipboard.writeText(url);
            alert("Game Link Copied!");
        }

        function showHistory() {
            showScreen('history-screen');
            // Basic history logic can be added here if needed
        }
    </script>
</body>
</html>
