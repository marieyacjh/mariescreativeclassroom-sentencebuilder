<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentence Builder - Marie's Creative Classroom</title>
    <style>
        :root {
            --lego-red: #D11013;
            --lego-blue: #0055BF;
            --lego-yellow: #F7D117;
            --lego-white: #FFFFFF;
            --lego-black: #231F20;
            --lego-gray: #A0A5A9;
        }

        body {
            font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", sans-serif;
            background-color: #f0f0f0; color: var(--lego-black); margin: 0; padding: 0;
            overflow-x: hidden; touch-action: manipulation;
        }

        .brick-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .lego-brick {
            position: absolute; width: 40px; height: 25px; border-radius: 4px;
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.2); animation: fall 10s linear infinite;
        }
        .lego-brick::before, .lego-brick::after {
            content: ''; position: absolute; width: 10px; height: 5px;
            background: inherit; top: -5px; border-radius: 2px 2px 0 0;
        }
        .lego-brick::before { left: 7px; } .lego-brick::after { left: 23px; }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; position: relative; z-index: 1; }
        .active { display: flex; }

        .main-title { 
            font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900; color: var(--lego-red); 
            text-shadow: 3px 3px 0 var(--lego-white), 6px 6px 0 var(--lego-black); margin: 10px 0;
        }

        .btn {
            background-color: var(--lego-blue); color: white; border: 4px solid var(--lego-black);
            padding: 12px 25px; font-size: 1.2rem; font-weight: bold; border-radius: 8px;
            cursor: pointer; margin: 5px; box-shadow: 0 5px 0 var(--lego-black); transition: all 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--lego-black); }
        .btn-yellow { background-color: var(--lego-yellow); color: var(--lego-black); }
        .btn-red { background-color: var(--lego-red); }

        .sentence-area {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            min-height: 80px; width: 95%; background: white; padding: 15px;
            border: 4px solid var(--lego-black); border-radius: 12px; margin: 10px 0;
        }

        .word-tile {
            background: var(--lego-yellow); border: 3px solid var(--lego-black);
            padding: 8px 16px; font-size: 1.3rem; font-weight: bold;
            border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 var(--lego-black);
            user-select: none;
        }
        .word-tile.correct { background-color: #4CAF50; color: white; }
        .word-tile.error { background-color: var(--lego-red); color: white; animation: shake 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .photo-holder {
            width: 200px; height: 140px; border: 4px solid var(--lego-gray);
            background: #eee; margin-bottom: 5px; display: flex;
            align-items: center; justify-content: center; overflow: hidden; border-radius: 8px;
        }
        .photo-holder img { width: 100%; height: 100%; object-fit: cover; }

        .scoreboard { background: var(--lego-black); color: var(--lego-yellow); padding: 5px 20px; border-radius: 50px; font-size: 1.8rem; margin: 5px; }

        /* Edit UI */
        .edit-row { display: flex; gap: 10px; margin-bottom: 10px; width: 100%; align-items: center; background: #fff; padding: 10px; border-radius: 8px; border: 2px solid #000; }
        .drop-zone { width: 80px; height: 80px; border: 2px dashed #666; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; text-align: center; position: relative; overflow: hidden; }
        .drop-zone img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        .edit-input { flex-grow: 1; padding: 10px; border: 2px solid #000; border-radius: 5px; font-family: inherit; }

        .duel-container { display: flex; width: 100vw; height: calc(100vh - 120px); }
        .team-side { flex: 1; border: 2px solid var(--lego-black); display: flex; flex-direction: column; align-items: center; padding: 10px; background: rgba(255,255,255,0.8); }
    </style>
</head>
<body>

    <div class="brick-bg" id="brick-container"></div>

    <div id="menu-screen" class="screen active">
        <h1 class="main-title">SENTENCE BUILDER</h1>
        <p>Marie’s Creative Classroom</p>
        <button class="btn" onclick="openStyleSelect('practice')">PRACTICE</button>
        <button class="btn btn-yellow" onclick="showScreen('setup-screen')">TEAM DUEL</button>
        <button class="btn btn-red" onclick="refreshEditUI(); showScreen('edit-screen');">EDIT LIST</button>
        <button class="btn" onclick="copyGameLink()">GAME LINK</button>
    </div>

    <div id="setup-screen" class="screen">
        <h2>TEAM SETUP</h2>
        <div style="display:flex; gap: 20px; margin-bottom: 20px;">
            <div style="text-align:center;">
                <h3>TEAM A</h3>
                <input type="text" id="team-a-name" value="TEAM A" class="edit-input"><br><br>
                Students: <input type="text" id="team-a-nums" value="1-20" style="width:60px;">
            </div>
            <div style="text-align:center;">
                <h3>TEAM B</h3>
                <input type="text" id="team-b-name" value="TEAM B" class="edit-input"><br><br>
                Students: <input type="text" id="team-b-nums" value="1-20" style="width:60px;">
            </div>
        </div>
        <button class="btn" onclick="openStyleSelect('duel')">CONTINUE</button>
    </div>

    <div id="mode-screen" class="screen">
        <h2>CHOOSE STYLE</h2>
        <button class="btn" onclick="initGame('unscramble')">UNSCRAMBLE</button>
        <button class="btn btn-yellow" onclick="initGame('wrong')">WHAT'S WRONG?</button>
    </div>

    <div id="game-screen" class="screen">
        <div style="background:white; padding: 10px; border-radius: 10px; border: 3px solid #000; margin-bottom: 10px;">
            Students (Total): <input type="text" id="practice-student-range" value="1-20" style="width:60px;">
            <button onclick="pickStudent('st-num-p', document.getElementById('practice-student-range').value)">PICK</button>
            <b id="st-num-p" style="margin-left:10px;">-</b>
        </div>
        <div class="photo-holder" id="photo-p"></div>
        <div id="sentence-container" class="sentence-area"></div>
        <div id="pool-container" class="sentence-area"></div>
        <div id="feedback-p" style="font-weight:bold; color:green; min-height:1.5em;"></div>
        <div style="display:flex; gap: 10px;">
            <button class="btn btn-yellow" onclick="speakText()">LISTEN 🔊</button>
            <button id="next-btn-p" class="btn" style="display:none;" onclick="nextRound()">NEXT ROUND ➔</button>
        </div>
        <button class="btn btn-red" onclick="showScreen('menu-screen')">QUIT</button>
    </div>

    <div id="duel-screen" class="screen" style="padding:0;">
        <div class="duel-container">
            <div class="team-side">
                <h3 id="label-a">TEAM A</h3>
                <div class="scoreboard" id="score-a">0</div>
                <div style="font-size: 0.9rem;">Student: <b id="st-num-a">-</b> <button onclick="pickStudent('st-num-a', 'a')">PICK</button></div>
                <div class="photo-holder" id="photo-a"></div>
                <div id="area-a" class="sentence-area"></div>
                <div id="pool-a" class="sentence-area"></div>
            </div>
            <div class="team-side">
                <h3 id="label-b">TEAM B</h3>
                <div class="scoreboard" id="score-b">0</div>
                <div style="font-size: 0.9rem;">Student: <b id="st-num-b">-</b> <button onclick="pickStudent('st-num-b', 'b')">PICK</button></div>
                <div class="photo-holder" id="photo-b"></div>
                <div id="area-b" class="sentence-area"></div>
                <div id="pool-b" class="sentence-area"></div>
            </div>
        </div>
        <div style="padding: 10px; display:flex; gap: 10px; background: var(--lego-black); width:100%; justify-content: center;">
            <button class="btn btn-yellow" onclick="speakText()">LISTEN</button>
            <button id="next-btn-duel" class="btn" style="display:none;" onclick="nextRound()">NEXT ROUND ➔</button>
            <button class="btn btn-red" onclick="showScreen('menu-screen')">EXIT</button>
        </div>
    </div>

    <div id="edit-screen" class="screen">
        <h2>EDIT LIST (Drag Images to Boxes)</h2>
        <div id="edit-list-container" style="width: 100%; max-height: 60vh; overflow-y: auto;"></div>
        <button class="btn" onclick="addNewRow()">+ ADD NEW</button>
        <button class="btn btn-yellow" onclick="showScreen('menu-screen')">SAVE & BACK</button>
    </div>

    <script>
        let gameList = [{sentence: "The big dog runs fast", img: ""}, {sentence: "Cats like to sleep", img: ""}];
        let currentIndex = 0;
        let currentGameMode = 'practice';
        let currentGameStyle = 'unscramble';
        let scoreA = 0, scoreB = 0;
        let roundActive = true;

        window.onload = () => {
            createBricks();
            const params = new URLSearchParams(window.location.search);
            if(params.get('d')) gameList = JSON.parse(atob(params.get('d')));
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openStyleSelect(mode) { currentGameMode = mode; showScreen('mode-screen'); }

        function initGame(style) {
            currentGameStyle = style;
            currentIndex = 0; scoreA = 0; scoreB = 0;
            loadCurrentRound();
        }

        function loadCurrentRound() {
            roundActive = true;
            document.getElementById('next-btn-p').style.display = 'none';
            document.getElementById('next-btn-duel').style.display = 'none';
            if(document.getElementById('feedback-p')) document.getElementById('feedback-p').innerText = '';

            if(currentGameMode === 'practice') {
                showScreen('game-screen');
                setupArea('sentence-container', 'pool-container', 'photo-p');
            } else {
                showScreen('duel-screen');
                document.getElementById('label-a').innerText = document.getElementById('team-a-name').value;
                document.getElementById('label-b').innerText = document.getElementById('team-b-name').value;
                setupArea('area-a', 'pool-a', 'photo-a', 'A');
                setupArea('area-b', 'pool-b', 'photo-b', 'B');
            }
            updateScores();
        }

        function setupArea(targetId, poolId, photoId, team = null) {
            const target = document.getElementById(targetId);
            const pool = document.getElementById(poolId);
            const photo = document.getElementById(photoId);
            target.innerHTML = ''; pool.innerHTML = '';
            
            const item = gameList[currentIndex];
            photo.innerHTML = item.img ? `<img src="${item.img}">` : "🖼️";
            
            let words = item.sentence.split(' ');

            if(currentGameStyle === 'unscramble') {
                let shuffled = [...words].sort(() => Math.random() - 0.5);
                shuffled.forEach(w => {
                    const tile = document.createElement('div');
                    tile.className = 'word-tile';
                    tile.innerText = w;
                    tile.onclick = () => {
                        if(!roundActive) return;
                        if(tile.parentElement === pool) target.appendChild(tile);
                        else pool.appendChild(tile);
                        checkWin(target, words, team);
                    };
                    pool.appendChild(tile);
                });
            } else {
                // WHAT'S WRONG: Shuffle words in target
                let bugged = [...words].sort(() => Math.random() - 0.5);
                bugged.forEach(w => {
                    const tile = document.createElement('div');
                    tile.className = 'word-tile';
                    tile.innerText = w;
                    tile.onclick = () => {
                        if(!roundActive) return;
                        if(w !== words[bugged.indexOf(w)] || words.indexOf(w) !== bugged.indexOf(w)) {
                            tile.classList.add('correct');
                            endRound(team, item.sentence);
                        } else {
                            tile.classList.add('error');
                            setTimeout(() => tile.classList.remove('error'), 500);
                        }
                    };
                    target.appendChild(tile);
                });
            }
        }

        function checkWin(container, originalArr, team) {
            const current = Array.from(container.children).map(t => t.innerText);
            if(current.join(' ') === originalArr.join(' ')) {
                Array.from(container.children).forEach(t => t.classList.add('correct'));
                endRound(team);
            }
        }

        function endRound(team, correctSentence = null) {
            if(!roundActive) return;
            roundActive = false;

            if(team === 'A') scoreA++;
            if(team === 'B') scoreB++;
            updateScores();

            if(currentGameMode === 'practice') {
                document.getElementById('next-btn-p').style.display = 'block';
                if(correctSentence) document.getElementById('feedback-p').innerText = "Correct: " + correctSentence;
            } else {
                document.getElementById('next-btn-duel').style.display = 'block';
                // Show correct sentence for both sides if style was "What's Wrong"
                if(correctSentence) {
                    document.getElementById('area-a').innerText = "✅ " + correctSentence;
                    document.getElementById('area-b').innerText = "✅ " + correctSentence;
                }
            }
        }

        function nextRound() {
            currentIndex++;
            if(currentIndex >= gameList.length) {
                alert("Game Over! Final Scores - " + scoreA + " to " + scoreB);
                showScreen('menu-screen');
            } else {
                loadCurrentRound();
            }
        }

        function updateScores() {
            document.getElementById('score-a').innerText = scoreA;
            document.getElementById('score-b').innerText = scoreB;
        }

        /* --- PICK STUDENT LOGIC --- */
        function pickStudent(displayId, teamKey) {
            let rangeStr = "";
            if(teamKey === 'a') rangeStr = document.getElementById('team-a-nums').value;
            else if(teamKey === 'b') rangeStr = document.getElementById('team-b-nums').value;
            else rangeStr = teamKey; // Practice mode direct string

            let nums = [];
            rangeStr.split(',').forEach(r => {
                if(r.includes('-')) {
                    let p = r.split('-');
                    for(let i=parseInt(p[0]); i<=parseInt(p[1]); i++) nums.push(i);
                } else nums.push(parseInt(r));
            });
            nums = nums.filter(n => !isNaN(n));
            if(nums.length) document.getElementById(displayId).innerText = "#" + nums[Math.floor(Math.random()*nums.length)];
        }

        /* --- EDIT LIST WITH IMAGE DRAG --- */
        function refreshEditUI() {
            const container = document.getElementById('edit-list-container');
            container.innerHTML = '';
            gameList.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'edit-row';
                row.innerHTML = `
                    <div class="drop-zone" id="drop-${idx}">
                        ${item.img ? `<img src="${item.img}">` : 'Drop Image Here'}
                    </div>
                    <input type="text" class="edit-input" value="${item.sentence}" placeholder="Type sentence..." onchange="gameList[${idx}].sentence=this.value">
                    <button class="btn-red" onclick="gameList.splice(${idx},1); refreshEditUI();">X</button>
                `;
                container.appendChild(row);
                setupDropZone(document.getElementById(`drop-${idx}`), idx);
            });
        }

        function setupDropZone(zone, idx) {
            zone.ondragover = (e) => e.preventDefault();
            zone.ondrop = (e) => {
                e.preventDefault();
                const files = e.dataTransfer.files;
                if(files.length) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        gameList[idx].img = ev.target.result;
                        refreshEditUI();
                    };
                    reader.readAsDataURL(files[0]);
                }
            };
        }

        function addNewRow() { gameList.push({sentence: "", img: ""}); refreshEditUI(); }

        function copyGameLink() {
            const data = btoa(JSON.stringify(gameList));
            const url = window.location.href.split('?')[0] + "?d=" + data;
            navigator.clipboard.writeText(url);
            alert("Game Link Copied!");
        }

        function speakText() {
            const u = new SpeechSynthesisUtterance(gameList[currentIndex].sentence);
            window.speechSynthesis.speak(u);
        }

        function createBricks() {
            const container = document.getElementById('brick-container');
            const colors = ['#D11013', '#0055BF', '#F7D117', '#FFFFFF'];
            for(let i=0; i<15; i++) {
                const b = document.createElement('div');
                b.className = 'lego-brick';
                b.style.left = Math.random() * 95 + '%';
                b.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                b.style.animationDelay = (Math.random() * 8) + 's';
                container.appendChild(b);
            }
        }
    </script>
</body>
</html>
