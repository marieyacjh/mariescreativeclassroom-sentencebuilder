<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentence Builder - Marie's Creative Classroom</title>
    <style>
        :root {
            --lego-red: #D11013;
            --lego-blue: #0055BF;
            --lego-yellow: #F7D117;
            --lego-white: #FFFFFF;
            --lego-black: #231F20;
            --lego-gray: #A0A5A9;
        }

        body {
            font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", sans-serif;
            background-color: #f0f0f0;
            color: var(--lego-black);
            margin: 0; padding: 0;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Falling LEGO Bricks Background */
        .brick-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .lego-brick {
            position: absolute; width: 40px; height: 25px; border-radius: 4px;
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.2);
            animation: fall 10s linear infinite;
        }
        .lego-brick::before, .lego-brick::after {
            content: ''; position: absolute; width: 10px; height: 5px;
            background: inherit; top: -5px; border-radius: 2px 2px 0 0;
        }
        .lego-brick::before { left: 7px; } .lego-brick::after { left: 23px; }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; position: relative; z-index: 1; }
        .active { display: flex; }

        .main-title { 
            font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900; color: var(--lego-red); 
            text-shadow: 3px 3px 0 var(--lego-white), 6px 6px 0 var(--lego-black);
            margin: 10px 0;
        }

        .btn {
            background-color: var(--lego-blue); color: white; border: 4px solid var(--lego-black);
            padding: 12px 25px; font-size: 1.2rem; font-weight: bold; border-radius: 8px;
            cursor: pointer; margin: 5px; box-shadow: 0 5px 0 var(--lego-black);
            transition: all 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--lego-black); }
        .btn-yellow { background-color: var(--lego-yellow); color: var(--lego-black); }
        .btn-red { background-color: var(--lego-red); }

        /* Gameplay Components */
        .sentence-area {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            min-height: 80px; width: 95%; background: white; padding: 15px;
            border: 4px solid var(--lego-black); border-radius: 12px; margin: 10px 0;
        }

        .word-tile {
            background: var(--lego-yellow); border: 3px solid var(--lego-black);
            padding: 8px 16px; font-size: 1.3rem; font-weight: bold;
            border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 var(--lego-black);
            user-select: none; transition: transform 0.2s;
        }
        .word-tile.correct { background-color: #4CAF50; color: white; cursor: default; }

        .photo-holder {
            width: 200px; height: 140px; border: 4px solid var(--lego-gray);
            background: #eee; margin-bottom: 5px; display: flex;
            align-items: center; justify-content: center; overflow: hidden; border-radius: 8px;
        }
        .photo-holder img { width: 100%; height: 100%; object-fit: cover; }

        .scoreboard {
            background: var(--lego-black); color: var(--lego-yellow);
            padding: 5px 20px; border-radius: 50px; font-size: 1.8rem; margin: 5px;
        }

        /* Edit List Specifics */
        .edit-row { display: flex; gap: 10px; margin-bottom: 10px; width: 100%; align-items: center; }
        .edit-img-preview { width: 50px; height: 50px; border: 2px solid #000; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
        .edit-input { flex-grow: 1; padding: 10px; border: 2px solid #000; border-radius: 5px; }

        /* Duel Layout */
        .duel-container { display: flex; width: 100vw; height: calc(100vh - 120px); }
        .team-side { flex: 1; border: 2px solid var(--lego-black); display: flex; flex-direction: column; align-items: center; padding: 10px; background: rgba(255,255,255,0.8); }
    </style>
</head>
<body>

    <div class="brick-bg" id="brick-container"></div>

    <div id="menu-screen" class="screen active">
        <h1 class="main-title">SENTENCE BUILDER</h1>
        <p>Marie’s Creative Classroom</p>
        <button class="btn" onclick="showScreen('mode-screen', 'practice')">PRACTICE</button>
        <button class="btn btn-yellow" onclick="showScreen('setup-screen')">TEAM DUEL</button>
        <button class="btn btn-red" onclick="refreshEditUI(); showScreen('edit-screen');">EDIT LIST</button>
        <button class="btn" onclick="copyGameLink()">GAME LINK</button>
        <button class="btn btn-yellow" onclick="alert('History: Feature coming soon!')">LINK HISTORY</button>
    </div>

    <div id="setup-screen" class="screen">
        <h2>TEAM SETUP</h2>
        <div style="display:flex; gap: 20px; margin-bottom: 20px;">
            <div style="text-align:center;">
                <h3>TEAM A</h3>
                <input type="text" id="team-a-name" value="TEAM A" class="edit-input"><br><br>
                Students: <input type="text" id="team-a-nums" value="1-20" style="width:50px;">
            </div>
            <div style="text-align:center;">
                <h3>TEAM B</h3>
                <input type="text" id="team-b-name" value="TEAM B" class="edit-input"><br><br>
                Students: <input type="text" id="team-b-nums" value="1-20" style="width:50px;">
            </div>
        </div>
        <button class="btn" onclick="startDuelSetup()">CONTINUE</button>
    </div>

    <div id="mode-screen" class="screen">
        <h2>CHOOSE STYLE</h2>
        <button class="btn" onclick="initGame('unscramble')">UNSCRAMBLE</button>
        <button class="btn btn-yellow" onclick="initGame('wrong')">WHAT'S WRONG?</button>
    </div>

    <div id="game-screen" class="screen">
        <div style="background:white; padding: 10px; border-radius: 10px; border: 3px solid #000; margin-bottom: 10px;">
            Student: <b id="st-num-p">-</b> 
            <button onclick="pickStudent('st-num-p', '1-20')">PICK</button>
        </div>
        <div class="photo-holder" id="photo-p"></div>
        <div id="sentence-container" class="sentence-area"></div>
        <div id="pool-container" class="sentence-area" style="background: rgba(0,0,0,0.05)"></div>
        <div style="display:flex; gap: 10px;">
            <button class="btn btn-yellow" onclick="speakText()">LISTEN 🔊</button>
            <button id="next-btn-p" class="btn" style="display:none;" onclick="nextRound()">NEXT ROUND ➔</button>
        </div>
        <button class="btn btn-red" onclick="showScreen('menu-screen')">QUIT</button>
    </div>

    <div id="duel-screen" class="screen" style="padding:0;">
        <div class="duel-container">
            <div class="team-side">
                <h3 id="label-a">TEAM A</h3>
                <div class="scoreboard" id="score-a">0</div>
                <div style="font-size: 0.9rem; margin-bottom: 5px;">Student: <b id="st-num-a">-</b> <button onclick="pickStudent('st-num-a', 'a')">PICK</button></div>
                <div class="photo-holder" id="photo-a"></div>
                <div id="area-a" class="sentence-area"></div>
                <div id="pool-a" class="sentence-area"></div>
            </div>
            <div class="team-side">
                <h3 id="label-b">TEAM B</h3>
                <div class="scoreboard" id="score-b">0</div>
                <div style="font-size: 0.9rem; margin-bottom: 5px;">Student: <b id="st-num-b">-</b> <button onclick="pickStudent('st-num-b', 'b')">PICK</button></div>
                <div class="photo-holder" id="photo-b"></div>
                <div id="area-b" class="sentence-area"></div>
                <div id="pool-b" class="sentence-area"></div>
            </div>
        </div>
        <div style="padding: 10px; display:flex; gap: 10px; background: var(--lego-black); width:100%; justify-content: center;">
            <button class="btn btn-yellow" onclick="speakText()">LISTEN</button>
            <button id="next-btn-duel" class="btn" style="display:none;" onclick="nextRound()">NEXT ROUND ➔</button>
            <button class="btn btn-red" onclick="showScreen('menu-screen')">EXIT</button>
        </div>
    </div>

    <div id="edit-screen" class="screen">
        <h2>EDIT SENTENCES</h2>
        <div id="edit-list-container" style="width: 100%; max-height: 60vh; overflow-y: auto; margin-bottom: 20px;"></div>
        <button class="btn" onclick="addNewRow()">+ ADD SENTENCE</button>
        <button class="btn btn-yellow" onclick="saveEdits()">SAVE ALL</button>
        <button class="btn btn-red" onclick="showScreen('menu-screen')">BACK</button>
    </div>

    <script>
        let gameList = [
            {sentence: "The big dog runs fast", img: "https://images.unsplash.com/photo-1517849845537-4d257902454a?w=100"},
            {sentence: "I like eating pizza", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=100"}
        ];
        let currentIndex = 0;
        let currentGameMode = 'practice';
        let currentGameStyle = 'unscramble';
        let scoreA = 0, scoreB = 0;
        let teamAFinished = false, teamBFinished = false;

        window.onload = () => {
            createBricks();
            const params = new URLSearchParams(window.location.search);
            if(params.get('d')) gameList = JSON.parse(atob(params.get('d')));
        };

        function showScreen(id, mode = null) {
            if(mode) currentGameMode = mode;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        /* --- GAME LOGIC --- */
        function initGame(style) {
            currentGameStyle = style;
            currentIndex = 0;
            scoreA = 0; scoreB = 0;
            if(currentGameMode === 'practice') {
                showScreen('game-screen');
                loadRound('sentence-container', 'pool-container', 'photo-p');
            } else {
                showScreen('duel-screen');
                loadRound('area-a', 'pool-a', 'photo-a', 'A');
                loadRound('area-b', 'pool-b', 'photo-b', 'B');
            }
        }

        function loadRound(targetId, poolId, photoId, team = null) {
            const target = document.getElementById(targetId);
            const pool = document.getElementById(poolId);
            const photo = document.getElementById(photoId);
            target.innerHTML = ''; pool.innerHTML = '';
            
            const item = gameList[currentIndex];
            photo.innerHTML = `<img src="${item.img || 'https://via.placeholder.com/150'}">`;
            
            let words = item.sentence.split(' ');
            
            if(currentGameStyle === 'unscramble') {
                // Shuffle pool
                let shuffled = [...words].sort(() => Math.random() - 0.5);
                shuffled.forEach(w => {
                    const tile = createTile(w, target, pool, words, team);
                    pool.appendChild(tile);
                });
            } else {
                // WHAT'S WRONG: Shuffle words in the sentence area
                let bugged = [...words];
                // Swap at least two words
                if(bugged.length > 1) {
                    let idx1 = 0, idx2 = 1;
                    [bugged[idx1], bugged[idx2]] = [bugged[idx2], bugged[idx1]];
                }
                bugged.forEach(w => {
                    const tile = document.createElement('div');
                    tile.className = 'word-tile';
                    tile.innerText = w;
                    tile.onclick = () => {
                        tile.style.backgroundColor = (tile.innerText === words[bugged.indexOf(w)]) ? '#4CAF50' : '#D11013';
                        checkManualWin(team);
                    };
                    target.appendChild(tile);
                });
            }
            if(team === 'A') teamAFinished = false;
            if(team === 'B') teamBFinished = false;
            updateScores();
        }

        function createTile(word, target, pool, originalArr, team) {
            const tile = document.createElement('div');
            tile.className = 'word-tile';
            tile.innerText = word;
            tile.onclick = () => {
                if(tile.parentElement === pool) {
                    target.appendChild(tile);
                } else {
                    pool.appendChild(tile);
                }
                checkWin(target, originalArr, team);
            };
            return tile;
        }

        function checkWin(container, originalArr, team) {
            const current = Array.from(container.children).map(t => t.innerText);
            if(current.join(' ') === originalArr.join(' ')) {
                Array.from(container.children).forEach(t => t.classList.add('correct'));
                if(currentGameMode === 'practice') {
                    document.getElementById('next-btn-p').style.display = 'block';
                } else {
                    if(team === 'A') { teamAFinished = true; scoreA++; }
                    if(team === 'B') { teamBFinished = true; scoreB++; }
                    if(teamAFinished && teamBFinished) document.getElementById('next-btn-duel').style.display = 'block';
                    updateScores();
                }
            }
        }

        function checkManualWin(team) {
            // Placeholder for "What's wrong" logic - in classroom, teacher validates
            if(currentGameMode === 'practice') document.getElementById('next-btn-p').style.display = 'block';
            else {
                if(team === 'A') teamAFinished = true;
                if(team === 'B') teamBFinished = true;
                if(teamAFinished && teamBFinished) document.getElementById('next-btn-duel').style.display = 'block';
            }
        }

        function nextRound() {
            currentIndex++;
            document.getElementById('next-btn-p').style.display = 'none';
            document.getElementById('next-btn-duel').style.display = 'none';
            if(currentIndex >= gameList.length) {
                alert("Game Over!");
                showScreen('menu-screen');
            } else {
                initGame(currentGameStyle);
            }
        }

        /* --- SETUP & EDITING --- */
        function startDuelSetup() {
            document.getElementById('label-a').innerText = document.getElementById('team-a-name').value;
            document.getElementById('label-b').innerText = document.getElementById('team-b-name').value;
            showScreen('mode-screen', 'duel');
        }

        function refreshEditUI() {
            const container = document.getElementById('edit-list-container');
            container.innerHTML = '';
            gameList.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'edit-row';
                row.innerHTML = `
                    <div class="edit-img-preview" onclick="changeImg(${idx})">
                        <img src="${item.img}" style="width:100%; height:100%;" onerror="this.parentElement.innerText='URL'">
                    </div>
                    <input type="text" class="edit-input" value="${item.sentence}" onchange="updateSentence(${idx}, this.value)">
                    <button class="btn-red" onclick="removeRow(${idx})">X</button>
                `;
                container.appendChild(row);
            });
        }

        function changeImg(idx) {
            const newUrl = prompt("Paste Image URL:", gameList[idx].img);
            if(newUrl) { gameList[idx].img = newUrl; refreshEditUI(); }
        }

        function updateSentence(idx, val) { gameList[idx].sentence = val; }
        function addNewRow() { gameList.push({sentence: "New Sentence", img: ""}); refreshEditUI(); }
        function removeRow(idx) { gameList.splice(idx, 1); refreshEditUI(); }
        function saveEdits() { alert("Saved!"); showScreen('menu-screen'); }

        function pickStudent(id, team) {
            let range = "1-20";
            if(team === 'a') range = document.getElementById('team-a-nums').value;
            if(team === 'b') range = document.getElementById('team-b-nums').value;
            
            let nums = [];
            range.split(',').forEach(r => {
                if(r.includes('-')) {
                    let parts = r.split('-');
                    for(let i=parseInt(parts[0]); i<=parseInt(parts[1]); i++) nums.push(i);
                } else nums.push(parseInt(r));
            });
            document.getElementById(id).innerText = "#" + nums[Math.floor(Math.random()*nums.length)];
        }

        function copyGameLink() {
            const data = btoa(JSON.stringify(gameList));
            const url = window.location.href.split('?')[0] + "?d=" + data;
            navigator.clipboard.writeText(url);
            alert("Link Copied!");
        }

        function speakText() {
            const u = new SpeechSynthesisUtterance(gameList[currentIndex].sentence);
            window.speechSynthesis.speak(u);
        }

        function updateScores() {
            document.getElementById('score-a').innerText = scoreA;
            document.getElementById('score-b').innerText = scoreB;
        }

        function createBricks() {
            const container = document.getElementById('brick-container');
            const colors = ['#D11013', '#0055BF', '#F7D117', '#FFFFFF'];
            for(let i=0; i<15; i++) {
                const b = document.createElement('div');
                b.className = 'lego-brick';
                b.style.left = Math.random() * 95 + '%';
                b.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                b.style.animationDelay = (Math.random() * 8) + 's';
                container.appendChild(b);
            }
        }
    </script>
</body>
</html>
